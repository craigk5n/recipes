name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, pdo, pdo_mysql, gd, fileinfo
        coverage: none

    # Not --strict: it fails on the deliberate exact pin of sortablejs, which is
    # correct here because the custom repository entry serves one fixed zip URL.
    # Plain validate still catches schema errors and a stale composer.lock.
    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Style and static analysis do not vary by PHP version, so run them once.
    - name: Run PHP CodeSniffer
      if: matrix.php-version == '8.2'
      run: composer phpcs

    - name: Run PHPStan
      if: matrix.php-version == '8.2'
      run: composer phpstan

    - name: Run PHPUnit
      run: composer test
